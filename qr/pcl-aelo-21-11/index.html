  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center;
           justify-content: center; height: 100vh; margin: 0; color: #444; }
    a { color: inherit; }
  </style>

<body>
  <p>Apertura del profilo su <a href="https://share.volioapp.it/profile/92d53474-0071-70fc-3beb-1e8aaed9b8ff">Volio</a>…</p>

  <script>
    // ==== CONFIG ====
    var GOATCOUNTER_CODE = "volioapp";          // same GoatCounter as volioapp.it
    var TARGET           = "https://share.volioapp.it/profile/92d53474-0071-70fc-3beb-1e8aaed9b8ff";

    // QR name = last folder in the URL (volioapp.it/qr/pcl-aelo-21-11/ -> "pcl-aelo-21-11").
    // For another QR: copy this folder inside qr/, rename it and change TARGET.
    var QR_NAME     = (location.pathname.split("/").filter(Boolean).pop() || "unknown").toLowerCase();
    var COUNT_PATH  = "qr-" + QR_NAME;                    // event name in the dashboard
    var COUNT_TITLE = "QR: " + QR_NAME;
    // ================

    var done = false;
    function go() {
      if (done) return;
      done = true;
      location.replace(TARGET);
    }

    try {
      var url = "https://" + GOATCOUNTER_CODE + ".goatcounter.com/count"
              + "?p=" + encodeURIComponent(COUNT_PATH)
              + "&t=" + encodeURIComponent(COUNT_TITLE)
              + "&e=true"
              + "&r=" + encodeURIComponent(document.referrer)
              + "&rnd=" + Math.random().toString(36).slice(2);

      // keepalive lets the request finish even after the page navigates away
      fetch(url, { mode: "no-cors", keepalive: true, cache: "no-store" })
        .then(go, go);
    } catch (e) {
      go();
    }

    // Never keep the user waiting more than 800 ms
    setTimeout(go, 800);
  </script>
</body>
